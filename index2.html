 <!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفيق المسلم | kareem 🤍✨</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-md">
        <div class="max-w-xl mx-auto flex justify-between items-center">
            <h1 class="text-lg font-bold bg-gradient-to-r from-emerald-400 to-teal-400 bg-clip-text text-transparent">
                رفيق المسلم 🤍✨
            </h1>
            <div id="date-box" class="text-xs text-slate-400 font-medium"></div>
        </div>
    </header>

    <main class="max-w-xl w-full mx-auto p-4 flex-grow pb-24 space-y-6">

        <!-- بطاقة الإلهام اليومي -->
        <div class="bg-gradient-to-br from-slate-900 to-emerald-950/40 p-5 rounded-2xl border border-emerald-500/20 shadow-xl">
            <p class="text-xs text-emerald-400 font-bold mb-1">✨ إشراقة اليوم</p>
            <p id="daily-quote" class="text-sm text-slate-200 leading-relaxed font-medium">
                "استعن بالله ولا تعجز، فإن ما أصابك لم يكن ليخطئك."
            </p>
        </div>

        <!-- أزرار التنقل السريع -->
        <div class="grid grid-cols-3 gap-2">
            <button onclick="switchTab('quran')" class="tab-btn p-3 rounded-xl text-xs font-bold transition-all bg-emerald-600 text-white shadow-lg shadow-emerald-950" data-target="quran">📖 ورد القرآن</button>
            <button onclick="switchTab('adhkar')" class="tab-btn p-3 rounded-xl text-xs font-bold transition-all bg-slate-900 text-slate-300 border border-slate-800" data-target="adhkar">📿 الأذكار</button>
            <button onclick="switchTab("deeds")" class="tab-btn p-3 rounded-xl text-xs font-bold transition-all bg-slate-900 text-slate-300 border border-slate-800" data-target="deeds">🌱 أعمال القلوب</button>
        </div>

        <!-- تبويب القرآن -->
        <div id="tab-quran" class="tab-pane active space-y-4">
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 space-y-4">
                <h2 class="text-base font-bold text-emerald-400">متابعة الورد اليومي من القرآن</h2>
                <div class="flex items-center justify-between bg-slate-950 p-3 rounded-xl border border-slate-800">
                    <span class="text-sm text-slate-300">الصفحة الحالية التي وصلت إليها:</span>
                    <input type="number" id="quran-page" value="1" min="1" max="604" onchange="saveQuranProgress()"
                        class="w-20 bg-slate-900 border border-slate-700 rounded-lg text-center py-1 text-emerald-400 font-bold focus:outline-none">
                </div>
                <div class="w-full bg-slate-950 h-3 rounded-full overflow-hidden border border-slate-800">
                    <div id="quran-progress-bar" class="bg-emerald-500 h-full w-0 transition-all duration-500"></div>
                </div>
                <p id="quran-status" class="text-xs text-center text-slate-400"></p>
            </div>
        </div>

        <!-- تبويب الأذكار -->
        <div id="tab-adhkar" class="tab-pane space-y-4">
            <div class="bg-slate-900 p-5 rounded-2xl border border-slate-800 text-center space-y-6">
                <select id="adhkar-select" onchange="resetAdhkarCounter()" class="bg-slate-800 border border-slate-700 text-slate-200 rounded-xl px-4 py-2 w-full focus:outline-none text-sm">
                    <option value="33">سُبْحَانَ اللَّهِ (33 مرة)</option>
                    <option value="33">الْحَمْدُ لِلَّهِ (33 مرة)</option>
                    <option value="33">اللَّهُ أَكْبَرُ (33 مرة)</option>
                    <option value="100">لَا إِلَهَ إِلَّا اللَّهُ وَحْدَهُ لَا شَرِيكَ لَهُ (100 مرة)</option>
                </select>

                <div id="adhkar-count" class="text-6xl font-black text-emerald-400 my-4">0</div>

                <button onclick="incrementAdhkar()" class="w-36 h-36 bg-emerald-600 hover:bg-emerald-500 active:scale-95 text-white font-bold rounded-full shadow-2xl shadow-emerald-900/50 transition-all flex items-center justify-center mx-auto text-lg">
                    تسبيح 👆
                </button>

                <button onclick="resetAdhkarCounterManual()" class="text-xs text-slate-500 hover:text-red-400 transition-colors">
                    إعادة العداد
                </button>
            </div>
        </div>

        <!-- تبويب أعمال القلوب -->
        <div id="tab-deeds" class="tab-pane space-y-3">
            <h2 class="text-base font-bold text-emerald-400 mb-2">سنن وأعمال يومية مباركة</h2>
            <div id="deeds-container" class="space-y-2"></div>
        </div>

    </main>

    <audio id="click-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-pane').forEach(el => el.classList.remove('active'));
            document.getElementById('tab-' + tabId).classList.add('active');

            document.querySelectorAll('.tab-btn').forEach(btn => {
                if(btn.dataset.target === tabId) {
                    btn.className = "tab-btn p-3 rounded-xl text-xs font-bold transition-all bg-emerald-600 text-white shadow-lg shadow-emerald-950";
                } else {
                    btn.className = "tab-btn p-3 rounded-xl text-xs font-bold transition-all bg-slate-900 text-slate-300 border border-slate-800";
                }
            });
        }

        document.getElementById('date-box').innerText = new Date().toLocaleDateString('ar-EG', { weekday: 'long', month: 'short', day: 'numeric' });

        const sound = document.getElementById('click-sound');
        function playTone() {
            sound.currentTime = 0;
            sound.play().catch(e => {});
        }

        // القرآن
        const quranInput = document.getElementById('quran-page');
        quranInput.value = localStorage.getItem('companion_quran') || 1;
        updateQuranProgress();

        function saveQuranProgress() {
            const val = quranInput.value;
            localStorage.setItem('companion_quran', val);
            updateQuranProgress();
        }

        function updateQuranProgress() {
            const page = parseInt(quranInput.value) || 1;
            const percent = Math.round((page / 604) * 100);
            document.getElementById('quran-progress-bar').style.width = percent + '%';
            document.getElementById('quran-status',).innerText = `أتممت ${percent}% من ختم القرآن الكريم (صفحة ${page} من 604)`;
        }

        // الأذكار
        let adhkarCount = parseInt(localStorage.getItem('companion_adhkar')) || 0;
        const adhkarDisplay = document.getElementById('adhkar-count');
        adhkarDisplay.innerText = adhkarCount;

        function incrementAdhkar() {
            adhkarCount++;
            adhkarDisplay.innerText = adhkarCount;
            localStorage.setItem('companion_adhkar', adhkarCount);
            playTone();
        }

        function resetAdhkarCounterManual() {
            if(confirm("هل تريد تصفير العداد؟")) {
                adhkarCount = 0;
                adhkarDisplay.innerText = adhkarCount;
                localStorage.setItem('companion_adhkar', adhkarCount);
            }
        }

        function resetAdhkarCounter() {
            adhkarCount = 0;
            adhkarDisplay.innerText = 0;
            localStorage.setItem('companion_adhkar', 0);
        }

        // الأعمال اليومية
        let deeds = JSON.parse(localStorage.getItem('companion_deeds')) || [
            { text: "☀️ أذكار الصباح والمساء", done: false },
            { text: "💧 صلاة الضحى (ركعتين على الأقل)", done: false },
            { text: "🤝 إدخال السرور على مسلم أو إعانة محتاج", done: false },
            { text: "📖 قراءة صفحتين من القرآن بتمعن", done: false },
            { text: "🌙 الاستغفار وقت السحر أو قبل النوم", done: false }
        ];

        function renderDeeds() {
            const container = document.getElementById('deeds-container');
            container.innerHTML = '';
            deeds.forEach((deed, idx) => {
                const div = document.createElement('div');
                div.className = `p-3 rounded-xl border flex items-center gap-3 transition-all ${deed.done ? 'bg-slate-900/40 border-emerald-500/30' : 'bg-slate-900 border-slate-800'}`;
                div.innerHTML = `
                    <input type="checkbox" ${deed.done ? 'checked' : ''} onchange="toggleDeed(${idx})" class="w-5 h-5 accent-emerald-500 rounded cursor-pointer">
                    <span class="${deed.done ? 'line-through text-slate-500' : 'text-slate-200'} text-sm font-medium">${deed.text}</span>
                `;
                container.appendChild(div);
            });
        }

        function toggleDeed(idx) {
            deeds[idx].done = !deeds[idx].done;
            if (deeds[idx].done) playTone();
            localStorage.setItem('companion_deeds', JSON.stringify(deeds));
            renderDeeds();
        }

        renderDeeds();
    </script>
</body>
</html>
